name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Maven tests
        working-directory: backend
        run: mvn -B test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
