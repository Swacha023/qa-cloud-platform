name: Deploy
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Backend tests
        working-directory: backend
        run: mvn -B test
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Bootstrap ECR repository
        working-directory: infrastructure/terraform
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve -target=aws_ecr_repository.api
      - name: Build and push backend image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          REPOSITORY="${{ vars.PROJECT_NAME }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$REPOSITORY:${GITHUB_SHA}" ./backend
          docker push "$REGISTRY/$REPOSITORY:${GITHUB_SHA}"
      - name: Apply infrastructure
        working-directory: infrastructure/terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform apply -auto-approve
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm install
          npm run build
      - name: Upload frontend
        working-directory: infrastructure/terraform
        env:
          AWS_S3_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: aws s3 sync ../../frontend/dist "s3://$AWS_S3_BUCKET" --delete
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
