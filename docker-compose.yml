services:
  postgres:
    image: postgres:17-alpine
    container_name: qa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_platform}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: qa-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qa_platform
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-qa_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      APP_JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-to-at-least-32-characters}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_TEST_RUNNER_DIR: /workspace/test-runner
    ports:
      - "8080:8080"
    volumes:
      - ./test-runner:/workspace/test-runner
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: qa-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
