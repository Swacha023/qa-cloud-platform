spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qa_platform}
    username: ${SPRING_DATASOURCE_USERNAME:qa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:qa_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      fail-on-empty-beans: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  jwt-secret: ${APP_JWT_SECRET:change-this-local-secret-to-at-least-32-characters}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  test-runner-dir: ${APP_TEST_RUNNER_DIR:../test-runner}
  sqs-queue-url: ${APP_SQS_QUEUE_URL:}
